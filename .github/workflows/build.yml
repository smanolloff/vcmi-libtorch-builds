name: VCMI libtorch builds

on:
  workflow_dispatch:
    inputs:
      pytorch_ref:
        description: "pytorch ref (commit SHA or tag)"
        required: true
        default: "v2.7.1"  # e2d141dbde55c2a4370fac5165b0561b6af4798b
      target:
        description: "Target to build"
        type: choice
        default: all
        options:
          - all
          - win-x64
          - win-arm64
          - linux-x64
          - macos-x64
          - macos-arm64
          - ios-arm64
          - android-arm64
          - android-x64

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # https://docs.github.com/en/actions/reference/runners/github-hosted-runners#standard-github-hosted-runners-for-public-repositories
        # https://github.com/actions/runner-images/tree/main
        include:
          # - builder: windows-11-arm
          #   target: win-arm64

          # - builder: windows-2025
          #   target: win-x64

          # - builder: ubuntu-latest
          #   target: linux-x64

          # - builder: macos-15-intel
          #   target: macos-x64

          # - builder: macos-15
          #   target: macos-arm64

          - builder: macos-15
            target: ios-arm64

          - builder: macos-15
            target: android-arm64

          # - builder: macos-15
          #   target: android-x64

          # 32-bit android (armeabi-v7a) builds fail with assembler error
          # (same issue as https://github.com/tensorflow/tensorflow/issues/59970)

    runs-on: ${{ matrix.builder }}
    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout (this)
      if: ${{ inputs.target == matrix.target || inputs.target == 'all' }}
      uses: actions/checkout@v5

    - name: Setup Python
      if: ${{ inputs.target == matrix.target || inputs.target == 'all' }}
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Git config
      if: ${{ startsWith(matrix.target, 'win-') && (inputs.target == matrix.target || inputs.target == 'all') }}
      run: |
        git config --global core.longpaths true
        git config --global core.autocrlf true

    - name: Restore pytorch_src cache
      if: inputs.target == matrix.target || inputs.target == 'all'
      id: cache_pytorch_src
      uses: actions/cache@v4
      with:
        path: pytorch
        key: cache_pytorch_src-${{ inputs.pytorch_ref }}

    - name: Checkout pytorch
      if: steps.cache_pytorch_src.outputs.cache-hit != 'true'  && (inputs.target == matrix.target || inputs.target == 'all')
      uses: actions/checkout@v5
      with:
        submodules: recursive
        repository: pytorch/pytorch
        ref: "${{ inputs.pytorch_ref }}"
        path: pytorch

    - name: Save pytorch_src cache
      if: steps.cache_pytorch_src.outputs.cache-hit != 'true' && (inputs.target == matrix.target || inputs.target == 'all')
      uses: actions/cache/save@v4
      with:
        path: pytorch
        key: cache_pytorch_src-${{ inputs.pytorch_ref }}

    - name: Patch
      if: ${{ inputs.target == matrix.target || inputs.target == 'all' }}
      run: |
        set -euox pipefail
        targets="generic ${{matrix.target}}"

        cd pytorch
        for t in $targets; do
          dir="patches/${{inputs.pytorch_ref}}/$t"
          [ -d "$dir" ] || continue

          for p in "$dir/"*.patch; do
            [ -r "$p" ] || continue
            git apply -v "../$p"
          done
        done

    - name: set ANDROID_NDK
      if: ${{ contains(matrix.target, 'android') && (inputs.target == matrix.target || inputs.target == 'all') }}
      run: |
        cd "$ANDROID_HOME/ndk"
        curl -LO https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
        unzip android-ndk-r25c-linux.zip
        echo "ANDROID_NDK=$ANDROID_HOME/ndk/android-ndk-r25c" >> $GITHUB_ENV
        echo "ANDROID_NDK_HOME=$ANDROID_NDK" >> $GITHUB_ENV
        echo "ANDROID_NDK_ROOT=$ANDROID_NDK" >> $GITHUB_ENV

    - name: Build
      if: ${{ inputs.target == matrix.target || inputs.target == 'all' }}
      id: build
      run: |
        export OUTPUT_ARCHIVE_FILE=vcmi-libtorch-${{matrix.target}}.txz
        bash -x "scripts/${{matrix.target}}.sh"
        echo "artifact=$OUTPUT_ARCHIVE_FILE" >> $GITHUB_OUTPUT

    - name: Upload artifact
      if: ${{ inputs.target == matrix.target || inputs.target == 'all' }}
      uses: actions/upload-artifact@v4
      with:
        name: "${{steps.build.outputs.artifact}}"
        path: "${{steps.build.outputs.artifact}}"
        compression-level: 0
        if-no-files-found: error
